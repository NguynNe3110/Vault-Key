name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from tag
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          if not match:
              raise SystemExit('Use a stable version tag such as v1.0.0.')
          major, minor, patch = map(int, match.groups())
          code = major * 1_000_000 + minor * 1_000 + patch
          if major > 2099 or minor > 999 or patch > 999 or code < 1:
              raise SystemExit('Version is outside the supported Android versionCode range.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={tag[1:]}\ncode={code}\n')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Restore optional Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo '::warning::Firebase config is absent; this APK supports local storage only.'
          fi

      - name: Test, lint and build release with shared debug key
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          bash ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE" \
            --no-daemon --no-configuration-cache --console=plain

      - name: Verify APK and prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/VaultKey-$VERSION_NAME.apk"
          cd dist
          sha256sum "VaultKey-$VERSION_NAME.apk" > "VaultKey-$VERSION_NAME.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --verify-tag --title "VaultKey $TAG" --generate-notes
          fi

      - name: Remove temporary Firebase config
        if: always()
        run: |
          rm -f -- app/google-services.json
